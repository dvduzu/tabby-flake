name: check-upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 安装 Nix
        uses: determinatesystems/nix-installer-action@v16

      - name: 检查上游最新版本
        id: check
        run: |
          set -euo pipefail
          latest="$(curl -fsSL https://api.github.com/repos/Eugeny/tabby/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
          current="$(grep -oP 'version = "\K[^"]+' packages/tabby.nix | head -n 1)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "已是最新版本 $current"
          else
            echo "发现新版本 $latest（当前 $(echo "$current")）"
          fi

      - name: 更新版本与 hash
        if: steps.check.outputs.latest != steps.check.outputs.current
        run: |
          set -euo pipefail
          version="${{ steps.check.outputs.latest }}"
          url="https://github.com/Eugeny/tabby/releases/download/v${version}/tabby-${version}-linux-x64.AppImage"
          curl -fL --retry 3 -o /tmp/tabby.AppImage "$url"
          hash="$(nix hash file --type sha256 --sri /tmp/tabby.AppImage)"
          sed -i "s|version = \"[0-9.]*\";|version = \"${version}\";|" packages/tabby.nix
          sed -i "s|hash = \"sha256-[^\"]*\";|hash = \"${hash}\";|" packages/tabby.nix
          grep -E 'version = |hash = ' packages/tabby.nix

      - name: 构建验证
        if: steps.check.outputs.latest != steps.check.outputs.current
        run: nix build .#default --no-link --print-build-logs

      - name: 提交推送
        if: steps.check.outputs.latest != steps.check.outputs.current
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/tabby.nix
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 更新 tabby 至 ${{ steps.check.outputs.latest }}"
            git push origin main
          fi
